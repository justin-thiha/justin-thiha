<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="presentation">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3aa0ff" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#3aa0ff" stop-opacity="0.7"/>
      <stop offset="50%"  stop-color="#5ce1e6" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base line -->
  <rect x="0" y="11" width="1200" height="2" fill="url(#d)"/>

  <!-- Travelling highlight -->
  <rect x="-200" y="11" width="200" height="2" fill="url(#g)">
    <animate attributeName="x" from="-200" to="1200" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Three pulsing nodes -->
  <circle cx="300" cy="12" r="3" fill="#5ce1e6">
    <animate attributeName="r" values="2;4;2" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="12" r="3" fill="#5ce1e6">
    <animate attributeName="r" values="2;4;2" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="12" r="3" fill="#5ce1e6">
    <animate attributeName="r" values="2;4;2" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
  </circle>
</svg>
