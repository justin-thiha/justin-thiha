<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Justin Suan Thiha — Systems Architect, Leader, Builder">
  <!-- HERO — light variant. Same composition, recoloured for light GitHub theme. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#f8fafc"/>
      <stop offset="55%"  stop-color="#e2ecf8"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#006DAE"/>
      <stop offset="45%"  stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%"   stop-color="#006DAE" stop-opacity="0.18"/>
      <stop offset="50%"  stop-color="#0891b2" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#006DAE" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <g id="node">
      <circle r="2.2" fill="#0891b2">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <ellipse cx="600" cy="180" rx="520" ry="160" fill="url(#halo)">
    <animate attributeName="rx" values="500;560;500" dur="8s" repeatCount="indefinite"/>
  </ellipse>

  <g opacity="0.6">
    <g stroke="#006DAE" stroke-width="0.6" fill="none">
      <line x1="90"   y1="60"  x2="220"  y2="120"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="5s" repeatCount="indefinite"/></line>
      <line x1="220"  y1="120" x2="160"  y2="240"><animate attributeName="opacity" values="0.1;0.45;0.1" dur="6.2s" repeatCount="indefinite"/></line>
      <line x1="160"  y1="240" x2="60"   y2="310"><animate attributeName="opacity" values="0.12;0.55;0.12" dur="4.8s" repeatCount="indefinite"/></line>
      <line x1="220"  y1="120" x2="320"  y2="80"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="5.5s" repeatCount="indefinite"/></line>
      <line x1="320"  y1="80"  x2="420"  y2="180"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="6s" repeatCount="indefinite"/></line>
      <line x1="950"  y1="80"  x2="1050" y2="160"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="5.4s" repeatCount="indefinite"/></line>
      <line x1="1050" y1="160" x2="980"  y2="280"><animate attributeName="opacity" values="0.1;0.45;0.1" dur="6.6s" repeatCount="indefinite"/></line>
      <line x1="1050" y1="160" x2="1140" y2="220"><animate attributeName="opacity" values="0.1;0.55;0.1" dur="4.9s" repeatCount="indefinite"/></line>
      <line x1="850"  y1="290" x2="980"  y2="280"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="5.2s" repeatCount="indefinite"/></line>
      <line x1="320"  y1="80"  x2="160"  y2="240"><animate attributeName="opacity" values="0.08;0.35;0.08" dur="7s" repeatCount="indefinite"/></line>
      <line x1="1140" y1="220" x2="1080" y2="320"><animate attributeName="opacity" values="0.1;0.45;0.1" dur="6s" repeatCount="indefinite"/></line>
    </g>

    <use href="#node" x="90"   y="60"><animateTransform attributeName="transform" type="translate" values="0 0; 6 -3; 0 0" dur="9s" repeatCount="indefinite"/></use>
    <use href="#node" x="220"  y="120"><animateTransform attributeName="transform" type="translate" values="0 0; -4 5; 0 0" dur="11s" repeatCount="indefinite"/></use>
    <use href="#node" x="160"  y="240"><animateTransform attributeName="transform" type="translate" values="0 0; 5 4; 0 0" dur="10s" repeatCount="indefinite"/></use>
    <use href="#node" x="60"   y="310"><animateTransform attributeName="transform" type="translate" values="0 0; -3 -4; 0 0" dur="8.5s" repeatCount="indefinite"/></use>
    <use href="#node" x="320"  y="80"><animateTransform attributeName="transform" type="translate" values="0 0; 4 6; 0 0" dur="12s" repeatCount="indefinite"/></use>
    <use href="#node" x="420"  y="180"><animateTransform attributeName="transform" type="translate" values="0 0; -5 3; 0 0" dur="9.5s" repeatCount="indefinite"/></use>
    <use href="#node" x="950"  y="80"><animateTransform attributeName="transform" type="translate" values="0 0; 5 -4; 0 0" dur="10.5s" repeatCount="indefinite"/></use>
    <use href="#node" x="1050" y="160"><animateTransform attributeName="transform" type="translate" values="0 0; -4 5; 0 0" dur="11.5s" repeatCount="indefinite"/></use>
    <use href="#node" x="980"  y="280"><animateTransform attributeName="transform" type="translate" values="0 0; 3 -5; 0 0" dur="9.2s" repeatCount="indefinite"/></use>
    <use href="#node" x="1140" y="220"><animateTransform attributeName="transform" type="translate" values="0 0; -6 4; 0 0" dur="10.8s" repeatCount="indefinite"/></use>
    <use href="#node" x="850"  y="290"><animateTransform attributeName="transform" type="translate" values="0 0; 4 -3; 0 0" dur="8.8s" repeatCount="indefinite"/></use>
    <use href="#node" x="1080" y="320"><animateTransform attributeName="transform" type="translate" values="0 0; -3 -5; 0 0" dur="9.7s" repeatCount="indefinite"/></use>
  </g>

  <rect x="-400" y="0" width="400" height="360" fill="url(#sweep)">
    <animate attributeName="x" from="-400" to="1200" dur="6s" repeatCount="indefinite"/>
  </rect>

  <rect x="120" y="138" width="3" height="0" fill="url(#accent)">
    <animate attributeName="height" from="0" to="84" begin="0s" dur="0.7s" fill="freeze"/>
    <animate attributeName="y"      from="180" to="138" begin="0s" dur="0.7s" fill="freeze"/>
  </rect>

  <text x="150" y="158"
        fill="#0891b2"
        font-family="'JetBrains Mono','SF Mono',Menlo,monospace"
        font-size="13" letter-spacing="6" opacity="0">
    SYSTEMS ARCHITECT &#8212; LEADER &#8212; BUILDER
    <animate attributeName="opacity" from="0" to="0.9" begin="0.3s" dur="0.6s" fill="freeze"/>
  </text>

  <text x="150" y="218"
        fill="url(#accent)"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-weight="800" font-size="64" letter-spacing="-2" opacity="0">
    Justin Suan Thiha
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      from="0 14" to="0 0" begin="0.5s" dur="0.7s" fill="freeze"/>
  </text>

  <text x="150" y="252"
        fill="#0f172a"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-weight="500" font-size="20" opacity="0">
    CEO, Monash DeepNeuron &#160;&#160;//&#160;&#160; Associate ML Engineer Candidate
    <animate attributeName="opacity" from="0" to="0.92" begin="1.0s" dur="0.6s" fill="freeze"/>
  </text>

  <text x="150" y="284"
        fill="#475569"
        font-family="'JetBrains Mono','SF Mono',Menlo,monospace"
        font-size="14" opacity="0">
    Building RAG systems &#38; leading 130+ engineers at Australia&#8217;s largest student-led AI org.
    <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.6s" fill="freeze"/>
  </text>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.6s" fill="freeze"/>
    <circle cx="155" cy="318" r="3.5" fill="#16a34a">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="170" y="322"
          fill="#475569"
          font-family="'JetBrains Mono','SF Mono',Menlo,monospace"
          font-size="12" letter-spacing="1">
      currently shipping &#8226; Monash University &#8226; Melbourne, AU
    </text>
  </g>

  <text x="1170" y="32"
        fill="#94a3b8"
        font-family="'JetBrains Mono','SF Mono',Menlo,monospace"
        font-size="11" text-anchor="end" letter-spacing="2">
    v2026.1
  </text>

  <text x="1170" y="338"
        fill="#94a3b8"
        font-family="'JetBrains Mono','SF Mono',Menlo,monospace"
        font-size="11" text-anchor="end" letter-spacing="2">
    BE(Software) / BCom(Finance) &#8212; class of 2026
  </text>
</svg>
